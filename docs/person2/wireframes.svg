<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc">
<title id="title">Beans and Beats: six-module screen wireframes</title><desc id="desc">Order entry and barista queue belong to Person 1. Guest tracking, public ready board, menu controls and daily reports belong to Ayushman, Person 2.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#193b32}.title{font:36px Georgia,serif}.heading{font:25px Georgia,serif}.label{font-size:11px;letter-spacing:2px}.body{font-size:15px}.muted{fill:#69715f}.white{fill:#fff8e9}.frame{fill:#fffdf6;stroke:#c7cdbb}.rule{stroke:#dce0d1}.button{fill:#163e32}.field{fill:#f6f5ed;stroke:#c7cdbb}</style></defs>
<rect width="1600" height="1110" fill="#f8f5ec"/><text x="60" y="65" class="label" fill="#923e42">CHRISTMAS TOGETHER 2026 · SIX-SCREEN MAP</text><text x="60" y="115" class="title">A little coffee. A lot of good.</text><text x="60" y="148" class="body muted">Tablet controls ≥44px · phone-first tracking · readable public numbers · explicit sync freshness</text>
<g transform="translate(60 185)"><rect width="470" height="385" rx="6" class="frame"/><text x="24" y="34" class="label">01 / PERSON 1 · ORDER ENTRY</text><text x="24" y="78" class="heading">What can we make for you?</text><rect x="24" y="102" width="422" height="45" rx="3" class="field"/><text x="39" y="131" class="body muted">First name · public board notice</text><rect x="24" y="163" width="200" height="45" rx="3" class="field"/><text x="39" y="191" class="body">Drink / quantity</text><rect x="242" y="163" width="204" height="45" rx="3" class="field"/><text x="257" y="191" class="body">Milk / hot or iced</text><text x="24" y="249" class="body">Snapshot price + total · payment at POS</text><rect x="24" y="270" width="422" height="48" rx="3" class="button"/><text x="150" y="300" class="body white">Save order → show QR</text><text x="24" y="353" class="body muted">Durable local save · pending sync / conflict</text></g>
<g transform="translate(565 185)"><rect width="470" height="385" rx="6" class="frame"/><text x="24" y="34" class="label">02 / PERSON 1 · BARISTA QUEUE</text><text x="24" y="78" class="heading">A little goodness, in order.</text><text x="24" y="119" class="body">Queued (3) / Making (2) / Ready (1)</text><rect x="24" y="141" width="422" height="89" rx="3" class="field"/><text x="39" y="172" class="body">1126-A-001 · Jamie · 2 × latte</text><text x="39" y="204" class="body muted">Oat · hot · snapshot total</text><rect x="24" y="250" width="200" height="48" rx="3" class="button"/><text x="75" y="280" class="body white">Mark making</text><rect x="242" y="250" width="204" height="48" rx="3" class="button"/><text x="293" y="280" class="body white">Mark ready</text><text x="24" y="353" class="body muted">Collect / reasoned cancellation · revisions</text></g>
<g transform="translate(1070 185)"><rect width="470" height="385" rx="6" class="frame"/><text x="24" y="34" class="label">03 / PERSON 2 · GUEST PHONE</text><text x="24" y="78" class="heading">Your drinks are ready!</text><rect x="24" y="101" width="422" height="112" rx="3" class="button"/><text x="153" y="131" class="label white">YOUR ORDER</text><text x="120" y="180" font-size="37" class="white">1126-A-001</text><text x="24" y="244" class="body">Received → Making → Ready → Collected</text><text x="24" y="279" class="body">2 × latte · oat · hot</text><rect x="24" y="298" width="200" height="44" rx="3" class="field"/><text x="40" y="325" class="body">Enable sound alert</text><text x="24" y="366" class="body muted">Last synced / offline · foreground alert limits</text></g>
<g transform="translate(60 605)"><rect width="470" height="385" rx="6" fill="#163e32"/><text x="24" y="34" class="label white">04 / PERSON 2 · READY BOARD</text><text x="24" y="78" class="heading white">Good things are ready.</text><rect x="24" y="108" width="422" height="126" rx="3" fill="none" stroke="#8b9b7a"/><text x="48" y="162" font-size="41" class="white">1126-A-001</text><text x="48" y="204" font-size="26" class="white">Jamie</text><text x="24" y="273" class="body white">Only ready names + numbers</text><text x="24" y="306" class="body white">Remove on collection · empty state</text><text x="24" y="353" class="body white">Stale / offline: hide names, check counter</text></g>
<g transform="translate(565 605)"><rect width="470" height="385" rx="6" class="frame"/><text x="24" y="34" class="label">05 / PERSON 2 · LEAD MENU</text><text x="24" y="78" class="heading">A menu that keeps up.</text><rect x="24" y="108" width="422" height="45" rx="3" class="field"/><text x="39" y="137" class="body">Name / price in SGD</text><rect x="24" y="171" width="422" height="45" rx="3" class="field"/><text x="39" y="200" class="body">Milk / temperature options</text><text x="24" y="254" class="body">☐ Sold out today      ☑ Active on menu</text><rect x="24" y="277" width="180" height="48" rx="3" class="button"/><text x="66" y="307" class="body white">Save changes</text><text x="24" y="357" class="body muted">Durable pending state · revision conflict</text></g>
<g transform="translate(1070 605)"><rect width="470" height="385" rx="6" class="frame"/><text x="24" y="34" class="label">06 / PERSON 2 · LEAD REPORTS</text><text x="24" y="78" class="heading">A day of doing good.</text><text x="24" y="120" class="body">SGT date: 26 Nov 2026     ↓ Export CSV</text><rect x="24" y="143" width="422" height="51" fill="#f1e8d6"/><text x="39" y="173" class="body">Provisional: tablet freshness unknown</text><text x="24" y="241" font-size="30">7 cups        S$24.30</text><text x="24" y="275" class="body muted">2 cancelled cups / S$12.00 excluded</text><path d="M24 296h422M24 320h422" class="rule"/><text x="24" y="353" class="body muted">Snapshot lines · no guest names in CSV</text></g>
<text x="60" y="1040" class="body">Shared flow: durable order → synced queue → token-protected guest + minimal ready projection → collected name removed</text><text x="60" y="1073" class="body muted">Ayushman · Person 2 / Shared auth, offline outbox, database, API wiring and app shell remain Person 1's responsibility.</text>
</svg>
